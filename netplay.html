<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171c19">
  <title>好友联机 · 像素游乐室</title>
</head>
<body class="player-body netplay-body">
  <div id="player-workspace">
    <header class="player-header">
      <a class="back-link" href="/" aria-label="返回游戏库">← 游戏库</a>
      <strong id="game-title">正在读取卡带</strong><span class="player-chip">NES</span>
    </header>
    <main class="play-layout">
      <section class="play-area" aria-label="游戏画面与手柄">
        <div class="play-meta"><span class="player-number" id="seat-label">联机</span><span id="play-status" role="status">准备中</span></div>
        <button id="pause" class="tool-button menu-trigger" aria-haspopup="dialog" aria-controls="room-panel">Ⅱ 房间</button>
        <div class="screen-slot"><div class="screen-stage">
          <div id="emulator"></div>
          <div id="waiting-overlay" class="pause-label">等待开始</div>
        </div></div>
        <div class="controller" aria-label="游戏手柄">
          <div class="dpad" role="group" aria-label="八方向触控盘">
            <button type="button" data-input="up" aria-label="方向上" aria-pressed="false">▲</button>
            <button type="button" data-input="left" aria-label="方向左" aria-pressed="false">◀</button>
            <span aria-hidden="true"></span>
            <button type="button" data-input="right" aria-label="方向右" aria-pressed="false">▶</button>
            <button type="button" data-input="down" aria-label="方向下" aria-pressed="false">▼</button>
          </div>
          <div class="system-buttons"><button type="button" data-input="select" aria-pressed="false">SELECT</button><button type="button" data-input="start" aria-pressed="false">START</button></div>
          <div class="action-buttons"><button type="button" data-input="b" aria-label="B 键" aria-pressed="false">B</button><button type="button" data-input="a" aria-label="A 键" aria-pressed="false">A</button></div>
        </div>
      </section>
    </main>
  </div>
  <div id="room-panel" class="menu-layer" role="dialog" aria-modal="true" aria-labelledby="room-title">
    <section class="menu-sheet">
      <header class="menu-heading"><div><p class="eyebrow">PLAY TOGETHER</p><h2 id="room-title">一起插上卡带</h2></div><a class="tool-button" href="/">返回游戏库</a></header>
      <div class="menu-scroll">
        <p id="room-notice" role="status">创建一个房间，邀请朋友一起玩。</p>
        <form id="entry-form" class="room-entry">
          <button id="create-room" class="button primary" type="button" disabled>创建好友房间</button>
          <label>房间号<input id="room-code" autocomplete="off" autocapitalize="characters" maxlength="10" placeholder="输入朋友的房间号" pattern="[A-Fa-f0-9]{10}"></label>
          <label class="spectator-choice"><input id="spectator" type="checkbox"> 我来观战</label>
          <button id="join-room" class="button secondary" type="submit">加入房间</button>
        </form>
        <section id="joined-room" hidden>
          <div class="room-invite"><span>房间号 <strong id="invite-code"></strong></span><button id="copy-invite" class="tool-button">复制邀请链接</button></div>
          <ol id="members" class="room-members"></ol>
          <p id="room-help">每位朋友准备后，由房主开始。</p>
          <div class="room-actions"><button id="ready" class="button primary" disabled>正在加载卡带…</button><button id="start-room" class="button primary" hidden>开始这一局</button><button id="resume-room" class="button primary" hidden>重新同步并继续</button></div>
          <div class="room-actions"><button id="return-game" class="tool-button" hidden>返回画面</button><button id="leave-room" class="tool-button">退出房间</button><button id="sound" class="tool-button">♪ 声音开</button></div>
          <details class="game-details"><summary>连接信息</summary><p id="connection-stats"></p></details>
        </section>
        <p class="room-note">测试版 · 本卡带支持双人，可再邀请一位朋友观战。进入游戏后，请在游戏菜单选择双人模式。切到后台会暂停这一局。</p>
        <p id="room-error" role="alert" hidden></p>
      </div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/src/netplay/page.ts"></script>
</body>
</html>
